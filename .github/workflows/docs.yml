name: Web

# Publica la web (MkDocs Material sobre docs/) en GitHub Pages. Solo se despliega cuando el
# repositorio es público (Pages no está disponible en repositorios privados del plan gratuito);
# mientras tanto la web solo se construye en la integración continua (ci.yml).

on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Instalar MkDocs Material
        run: python -m pip install ".[docs]"

      - name: Construir la web
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: mkdocs build --strict --site-dir site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
